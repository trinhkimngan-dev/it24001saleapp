{% extends 'layout/base.html' %}
{% block title %}Trang chu{% endblock %}
{% block content %}
{% if products %}
    <div class="row">
        {% for c in products %}
        <div class="col-md-3 col-6 p-2">
            <div class="card">
                <img class="card-img-top" src="{{c.image}}" alt="Card image">
                <div class="card-body">
                    <h4 class="card-title">{{ c.name }}</h4>
                    <p class="card-text">{{ c.price }} VND</p>
                    <button href="#" class="btn btn-primary">Xem chi tiết</button>
                    <button href="#" class="btn btn-danger">Đặc hàng</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="alert alert-warning">
        Không có sản phẩm nào!
    </div>
    {% endif %}
{% endblock %}
